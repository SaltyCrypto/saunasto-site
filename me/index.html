<!DOCTYPE html>
<html lang="en">
<head>
<script>document.documentElement.classList.add("js")</script>
<meta charset="UTF-8">
<!-- SEO STAGE: per-page robots flag controlled by the generator.
     Hub + /the-100/ + featured (5+-venue) countries + their venue
     pages launch with index,follow. Single-venue and small-country
     pages stay noindex,nofollow until they earn their seat. -->
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My account · Saunasto</title>
<meta name="description" content="Your Saunasto account: votes, sign-in state, edit picks.">

<link rel="canonical" href="https://saunasto.com/me/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://saunasto.com/me/">
<meta property="og:title" content="My account · Saunasto">
<meta property="og:description" content="Your Saunasto account: votes, sign-in state, edit picks.">
<meta property="og:image" content="https://saunasto.com/assets/og-default.png">
<meta property="og:locale" content="en_US">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@saunasto">

<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css">



<script src="/assets/js/main.js" defer></script>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="/" class="logo">Saunasto</a>
    <nav>
      <a href="/the-100/">The 100</a>
      <a href="/vote/">Vote</a>
      <a href="/#countries">Countries</a>
      <a href="/#about">About</a>
    </nav>
    <a href="/login/" class="open-app">Sign in →</a>
  </div>
</header>


<div class="breadcrumb">
  <a href="/">Saunasto</a><span class="sep">/</span>
  <span>My account</span>
</div>

<section class="hero" style="grid-template-columns: 1fr;">
  <div style="max-width: 680px;">
    <h1>My <em>Saunasto</em>.</h1>
    <p class="lead" id="me-greeting">Loading…</p>
    <div id="me-content" style="display:none;margin-top:36px;">
      <div class="section-eyebrow" style="margin-bottom:12px;">Your votes · 2026-Q2</div>
      <div id="me-votes-list"></div>
      <div style="margin-top:36px;display:flex;gap:14px;">
        <a href="/vote/" class="open-app" style="display:inline-block;text-decoration:none;">Edit my picks →</a>
        <button id="btn-signout" style="background:transparent;color:var(--muted);padding:10px 0;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;border:0;cursor:pointer;">Sign out</button>
      </div>
    </div>
  </div>
</section>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const sb = createClient('https://wzpggmytlbhgzxyjvidr.supabase.co', 'sb_publishable__2urAIi6bnrK4MrmfXR_nA_QBzN-L4d');
  const QUARTER_KEY = '2026-Q2';

  const greet  = document.getElementById('me-greeting');
  const cont   = document.getElementById('me-content');
  const list   = document.getElementById('me-votes-list');

  async function init() {
    const { data: { user } } = await sb.auth.getUser();
    if (!user) {
      greet.innerHTML = 'Not signed in. <a href="/login/" style="color:var(--accent);">Sign in →</a>';
      return;
    }
    greet.textContent = `Signed in as ${user.email || user.id}.`;
    cont.style.display = 'block';

    const { data: votes } = await sb
      .from('saunasto_votes')
      .select('id, venue_id, created_at')
      .eq('quarter_key', QUARTER_KEY)
      .order('created_at', { ascending: true });

    if (!votes || votes.length === 0) {
      list.innerHTML = '<div style="font-family:Public Sans,sans-serif;color:var(--muted);">No picks yet for ' + QUARTER_KEY + '. <a href="/vote/" style="color:var(--accent);">Vote now →</a></div>';
      return;
    }
    list.innerHTML = votes.map((v, i) =>
      `<div style="font-family:JetBrains Mono,monospace;font-size:13px;padding:10px 0;border-bottom:1px solid var(--rule);">№ ${i + 1} · ${v.venue_id}</div>`
    ).join('');
  }
  init();
  sb.auth.onAuthStateChange(() => init());

  document.addEventListener('click', async (e) => {
    if (e.target.id === 'btn-signout') {
      await sb.auth.signOut();
      window.location.href = '/';
    }
  });
</script>

<footer>
  <div>Saunasto · The world's saunas, indexed.</div>
  <nav>
    <a href="/the-100/">The 100</a>
    <a href="/#countries">Countries</a>
    <a href="/#about">About</a>
    <a href="/privacy/">Privacy</a>
    <a href="/terms/">Terms</a>
  </nav>
</footer>

</body>
</html>
